[project]
name = "mdi-api"
version = "0.0.1"
description = "REST API for Media Downloader Index"
requires-python = ">=3.15,<3.16"
dependencies = [
    "asyncpg>=0.32.0",
    "granian>=2.8.9",
    "litestar>=2.25.0,<3",
    "msgspec>=0.22.0",
    "sqlalchemy[asyncio]>=2.1.9,<2.2",
    "w3lib>=2.6.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.405",
]

[tool.uv]
package = false
required-version = ">=0.13.9"
